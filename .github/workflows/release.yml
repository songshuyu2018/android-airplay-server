name: Build release APK (unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - "raop-announce"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Use JDK
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Test audio session ownership
        run: |
          mkdir -p /tmp/session-tests
          javac -d /tmp/session-tests app/src/main/java/io/github/jqssun/airplay/audio/AudioSessionGate.java tests/session/AudioSessionGateTest.java
          java -cp /tmp/session-tests AudioSessionGateTest

      - name: Test PCM spectrum
        run: |
          g++ -std=c++17 -Iapp/src/main/cpp tests/audio/spectrum_test.cpp -o /tmp/spectrum_test
          /tmp/spectrum_test

      - name: Test album palette contrast
        run: |
          mkdir -p /tmp/palette-tests
          javac -d /tmp/palette-tests app/src/main/java/io/github/jqssun/airplay/audio/PlayerPalette.java tests/player/PlayerPaletteTest.java
          java -cp /tmp/palette-tests PlayerPaletteTest

      - name: Test automatic audio presentation
        run: |
          mkdir -p /tmp/presentation-tests
          javac -d /tmp/presentation-tests app/src/main/java/io/github/jqssun/airplay/audio/AudioPresentationPolicy.java tests/presentation/AudioPresentationPolicyTest.java
          java -cp /tmp/presentation-tests AudioPresentationPolicyTest

      - name: Build release APK
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x ./gradlew
          set -o pipefail
          for attempt in 1 2 3; do
            build_log="$RUNNER_TEMP/gradle-build-$attempt.log"
            if ./gradlew assembleRelease --stacktrace 2>&1 | tee "$build_log"; then
              exit 0
            fi
            if grep -Eq '(^|[[:space:]])e: |[.](java|cpp|cc|c|h):[0-9]+(:[0-9]+)?: (fatal )?error:' "$build_log"; then
              exit 1
            fi
            if ! grep -Eiq 'Could not (GET|HEAD)|Read timed out|Connect(ion)? timed out|SocketTimeoutException|failed: timeout|HTTP response code: (429|50[0-9])|Received status code (429|50[0-9])|Temporary failure in name resolution|UnknownHostException|Connection reset|Remote host terminated the handshake' "$build_log"; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Transient dependency download failure; retrying build (attempt $((attempt + 1))/3)"
            sleep "$((attempt * 10))"
          done

      - name: Upload build diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: ${{ runner.temp }}/gradle-build-*.log
          if-no-files-found: ignore

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
